name: Report a problem
description: Report a reproducible error in the instructions or recipes.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not publish credentials, personal data, or private media. Use synthetic examples only."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the observed and expected behavior.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Relevant versions
      description: Provide the operating system, FFmpeg version, and other tools without local user paths.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use sanitized commands and synthetic fixtures.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed credentials, personal data, local paths, and private media.
          required: true
