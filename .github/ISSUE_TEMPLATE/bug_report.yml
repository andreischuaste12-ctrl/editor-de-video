name: Relatar problema
description: Informe um erro reproduzível nas instruções ou receitas.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Não publique credenciais, dados pessoais nem mídia privada. Use somente exemplos sintéticos."
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Explique o comportamento observado e o esperado.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versões relevantes
      description: Informe sistema, FFmpeg e outras ferramentas, sem caminhos de usuário.
  - type: textarea
    id: reproduction
    attributes:
      label: Reprodução
      description: Use comandos sanitizados e fixtures sintéticas.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidade
      options:
        - label: Removi credenciais, dados pessoais, caminhos locais e mídia privada.
          required: true
